<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Rizky Jasa</title>
    <style>
        :root { --gold: #d4af37; --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: auto; }
        .brand-header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        .brand-header h1 { color: var(--gold); margin: 0; font-size: 1.8em; letter-spacing: 1px; text-transform: uppercase; }
        .brand-header p { color: var(--gold); font-size: 0.8em; font-style: italic; margin-top: 5px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        label { display: block; font-size: 0.9em; margin-bottom: 5px; color: #aaa; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; font-size: 1em; }
        .btn-reset { width: 100%; padding: 12px; background: #d4af37; border: none; color: #000; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .result-box { background: #000; padding: 20px; border-radius: 12px; border-left: 4px solid var(--gold); }
        .val { font-size: 1.3em; font-weight: bold; color: var(--gold); }
        .hint { font-size: 0.8em; color: #888; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <h1>RIZKY JASA</h1>
        <p>Solusi Cerdas Untuk Usaha Cerdas</p>
    </div>
    
    <div class="card">
        <label>Nama Produk</label>
        <input type="text" id="nama" placeholder="Contoh: Piscok">
        
        <label>Biaya Bahan Baku (Rp)</label>
        <input type="text" id="bahan" placeholder="0" oninput="formatInput(this); hitung()">
        
        <label>Biaya Kemasan (Rp)</label>
        <input type="text" id="kemasan" placeholder="0" oninput="formatInput(this); hitung()">
        
        <label>Biaya Operasional (Rp)</label>
        <input type="text" id="opsional" placeholder="0" oninput="formatInput(this); hitung()">
        
        <label>Jumlah Produk yang Dihasilkan (pcs)</label>
        <input type="number" id="jumlah" placeholder="0" oninput="hitung()">
        
        <label>Target Profit (%)</label>
        <input type="number" id="margin" placeholder="0" oninput="hitung()">
        
        <button class="btn-reset" onclick="resetForm()">RESET SEMUA DATA</button>
    </div>

    <div class="result-box" id="hasilArea" style="display:none;">
        <div>Total HPP (1 batch): <span id="outHpp" class="val">Rp 0</span></div>
        <div style="margin-top:10px;">Modal per Pcs: <span id="outModalPcs" class="val">Rp 0</span></div>
        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
        <div style="font-size: 1.1em;">Rekomendasi Harga Jual: <br> <span id="outHargaJual" style="font-size: 2em; color:var(--gold);">Rp 0</span></div>
        <div class="hint">Catatan: Harga ini adalah harga dasar. Sesuaikan lagi dengan harga pasar.</div>
    </div>
</div>

<script>
    function formatInput(input) {
        let val = input.value.replace(/\D/g, '');
        input.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function getVal(id) {
        return parseFloat(document.getElementById(id).value.replace(/\./g, '')) || 0;
    }

    function hitung() {
        let bahan = getVal('bahan');
        let kemasan = getVal('kemasan');
        let opsional = getVal('opsional');
        let jumlah = parseFloat(document.getElementById('jumlah').value) || 0;
        let margin = parseFloat(document.getElementById('margin').value) || 0;

        if (jumlah <= 0) return;

        let hppBatch = bahan + kemasan + opsional;
        let modalPcs = hppBatch / jumlah;
        let hargaJual = modalPcs + (modalPcs * (margin / 100));

        document.getElementById('outHpp').innerText = "Rp " + Math.round(hppBatch).toLocaleString('id-ID');
        document.getElementById('outModalPcs').innerText = "Rp " + Math.round(modalPcs).toLocaleString('id-ID');
        document.getElementById('outHargaJual').innerText = "Rp " + Math.round(hargaJual).toLocaleString('id-ID');
        document.getElementById('hasilArea').style.display = 'block';
    }

    function resetForm() {
        document.querySelectorAll('input').forEach(input => input.value = '');
        document.getElementById('hasilArea').style.display = 'none';
    }
</script>

</body>
</html>
