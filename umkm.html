<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Rizky Jasa</title>
    <style>
        :root {
            --gold: #d4af37;
            --silver: #e0e0e0;
            --black: #121212;
            --dark-gray: #1e1e1e;
        }
        body {
            font-family: sans-serif;
            background-color: var(--black);
            color: var(--silver);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--dark-gray);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        h2 { color: var(--gold); text-align: center; border-bottom: 1px solid var(--gold); padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-size: 0.9em; }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid var(--gold);
            background: #000;
            color: #fff;
            box-sizing: border-box;
        }
        .result {
            margin-top: 25px;
            padding: 15px;
            background: #000;
            border-left: 5px solid var(--gold);
            text-align: center;
        }
        .result span { display: block; font-size: 1.5em; color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>RIZKY JASA</h2>
    <label>Harga Modal Produk (Rp)</label>
    <input type="number" id="modal" placeholder="0" oninput="hitung()">
    
    <label>Biaya Opsional/Tambahan (Opsional)</label>
    <input type="number" id="opsional" placeholder="0" oninput="hitung()">
    
    <label>Margin Keuntungan (%)</label>
    <input type="number" id="margin" placeholder="0" oninput="hitung()">

    <div class="result">
        Harga Jual Ideal:
        <span id="hargaJual">Rp 0</span>
    </div>
</div>

<script>
    function hitung() {
        let modal = parseFloat(document.getElementById('modal').value) || 0;
        let opsional = parseFloat(document.getElementById('opsional').value) || 0;
        let margin = parseFloat(document.getElementById('margin').value) || 0;
        
        let totalModal = modal + opsional;
        let hargaJual = totalModal + (totalModal * (margin / 100));
        
        document.getElementById('hargaJual').innerText = "Rp " + hargaJual.toLocaleString('id-ID');
        
        // Save to LocalStorage
        localStorage.setItem('modal', modal);
        localStorage.setItem('opsional', opsional);
        localStorage.setItem('margin', margin);
    }

    // Load from LocalStorage
    window.onload = () => {
        document.getElementById('modal').value = localStorage.getItem('modal') || '';
        document.getElementById('opsional').value = localStorage.getItem('opsional') || '';
        document.getElementById('margin').value = localStorage.getItem('margin') || '';
        hitung();
    };
</script>

</body>
</html>
