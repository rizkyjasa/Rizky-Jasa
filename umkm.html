<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator HPP - Rizky Jasa</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --bg: #0a0a0a; 
            --card: #141414; 
            --text: #ffffff; 
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: auto; }
        
        /* Branding Mewah */
        .brand-header {
            text-align: center;
            padding: 30px 0;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(0,0,0,0) 70%);
            margin-bottom: 20px;
        }
        .brand-header h1 {
            color: var(--gold);
            font-size: 2em;
            margin: 0;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(212,175,55,0.3);
        }
        .brand-header p {
            color: #888;
            font-size: 0.85em;
            letter-spacing: 2px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #222; margin-bottom: 20px; }
        label { display: block; font-size: 0.8em; margin-bottom: 8px; color: var(--gold); font-weight: bold; text-transform: uppercase; }
        input { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; font-size: 1.1em; }
        
        .btn-reset { width: 100%; padding: 12px; background: transparent; border: 1px solid #444; color: #888; border-radius: 10px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        
        .result-box { background: #000; padding: 25px; border-radius: 15px; border: 1px solid var(--gold); }
        .val { float: right; color: var(--gold); font-weight: bold; }
        .final-price { display: block; font-size: 2.5em; color: var(--gold); text-align: center; margin: 15px 0; font-weight: 800; }
        
        .wa-btn {
            display: block;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(37,211,102,0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <h1>RIZKY JASA</h1>
        <p>Solusi Cerdas Untuk Usaha Cerdas</p>
    </div>
    
    <div class="card">
        <label>Nama Produk</label>
        <input type="text" id="nama" placeholder="Contoh: Piscok Premium">
        
        <label>Biaya Bahan Baku (Rp)</label>
        <input type="text" id="bahan" placeholder="0" oninput="formatRupiah(this); hitung()">
        
        <label>Biaya Kemasan (Rp)</label>
        <input type="text" id="kemasan" placeholder="0" oninput="formatRupiah(this); hitung()">
        
        <label>Biaya Operasional (Rp)</label>
        <input type="text" id="opsional" placeholder="0" oninput="formatRupiah(this); hitung()">
        
        <label>Jumlah Produk yang Dihasilkan</label>
        <input type="text" id="jumlah" placeholder="0" oninput="formatRupiah(this); hitung()">
        
        <label>Target Profit (%)</label>
        <input type="text" id="margin" placeholder="0" oninput="formatRupiah(this); hitung()">
        
        <button class="btn-reset" onclick="resetForm()">RESET SEMUA DATA</button>
    </div>

    <div class="result-box" id="hasilArea" style="display:none;">
        <div style="font-size:0.9em;">Total HPP (1 Batch): <span id="outHpp" class="val">Rp 0</span></div>
        <div style="font-size:0.9em; margin-top:5px;">Modal per Pcs: <span id="outModalPcs" class="val">Rp 0</span></div>
        <span class="final-price" id="outHargaJual">Rp 0</span>
        <div style="font-size: 0.8em; color: #888; text-align:center;">Rekomendasi Harga Jual per Pcs</div>
        
        <a href="https://wa.me/6282125424346?text=Halo%20Rizky%20Jasa,%20saya%20butuh%20konsultasi%20bisnis." 
           class="wa-btn" target="_blank">💬 HUBUNGI RIZKY JASA</a>
    </div>
</div>

<script>
    function formatRupiah(input) {
        let val = input.value.replace(/\D/g, '');
        input.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        hitung();
    }
    function getVal(id) {
        return parseFloat(document.getElementById(id).value.replace(/\./g, '')) || 0;
    }
    function hitung() {
        let hpp = getVal('bahan') + getVal('kemasan') + getVal('opsional');
        let jml = getVal('jumlah');
        let margin = getVal('margin');
        if (jml <= 0) return;
        let modalPcs = hpp / jml;
        let jual = modalPcs + (modalPcs * (margin / 100));
        document.getElementById('outHpp').innerText = "Rp " + Math.round(hpp).toLocaleString('id-ID');
        document.getElementById('outModalPcs').innerText = "Rp " + Math.round(modalPcs).toLocaleString('id-ID');
        document.getElementById('outHargaJual').innerText = "Rp " + Math.round(jual).toLocaleString('id-ID');
        document.getElementById('hasilArea').style.display = 'block';
    }
    function resetForm() {
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('hasilArea').style.display = 'none';
    }
</script>
</body>
</html>
