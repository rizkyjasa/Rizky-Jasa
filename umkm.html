<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator HPP - Rizky Jasa</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --gold-light: #f3e5ab;
            --bg: #0a0a0a; 
            --card: #161616; 
            --text: #e0e0e0; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 450px; 
            margin: auto; 
        }
        /* Branding Mewah */
        .brand-box {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 25px;
            border-top: 1px solid var(--gold);
            border-bottom: 1px solid var(--gold);
            background: linear-gradient(180deg, rgba(212,175,55,0.05) 0%, rgba(0,0,0,0) 100%);
        }
        .brand-box h1 {
            color: var(--gold);
            margin: 0;
            font-size: 1.8em;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .brand-box p {
            color: var(--gold-light);
            font-size: 0.8em;
            letter-spacing: 1px;
            margin: 5px 0 0 0;
            text-transform: uppercase;
        }
        .card { 
            background: var(--card); 
            padding: 22px; 
            border-radius: 16px; 
            border: 1px solid #333; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            font-size: 0.85em; 
            margin-bottom: 6px; 
            color: #b0b0b0; 
            font-weight: 600;
        }
        input { 
            width: 100%; 
            padding: 12px 15px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #000; 
            color: #fff; 
            box-sizing: border-box; 
            font-size: 1.05em; 
        }
        input:focus {
            border-color: var(--gold);
            outline: none;
        }
        .btn-reset { 
            width: 100%; 
            padding: 12px; 
            background: transparent; 
            border: 1px solid var(--gold); 
            color: var(--gold); 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
            margin-top: 5px;
        }
        .btn-reset:hover { 
            background: var(--gold); 
            color: #000; 
        }
        .result-box { 
            background: #111; 
            padding: 22px; 
            border-radius: 14px; 
            border-left: 5px solid var(--gold); 
            border-top: 1px solid #333;
            border-right: 1px solid #333;
            border-bottom: 1px solid #333;
        }
        .val { font-size: 1.2em; font-weight: bold; color: var(--gold); float: right; }
        .result-row { margin-bottom: 12px; font-size: 0.95em; overflow: hidden; }
        .final-price { font-size: 2.2em; color: var(--gold); font-weight: 800; margin-top: 5px; display: block; }
        .advice-box {
            background: rgba(212,175,55,0.08);
            border: 1px dashed var(--gold);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.82em;
            color: #f1f1f1;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Branding Diperkuat -->
    <div class="brand-box">
        <h1>RIZKY JASA</h1>
        <p>Solusi Cerdas Untuk Usaha Cerdas</p>
    </div>
    
    <div class="card">
        <label>Nama Produk</label>
        <input type="text" id="nama" placeholder="Contoh: Keripik Singkong">
        
        <label>Biaya Bahan Baku (Rp)</label>
        <input type="text" id="bahan" placeholder="0" oninput="formatRupiah(this); hitung()">
        
        <label>Biaya Kemasan (Rp)</label>
        <input type="text" id="kemasan" placeholder="0" oninput="formatRupiah(this); hitung()">
        
        <label>Biaya Operasional (Rp)</label>
        <input type="text" id="opsional" placeholder="0" oninput="formatRupiah(this); hitung()">
        
        <label>Jumlah Produk yang Dihasilkan (pcs)</label>
        <input type="text" id="jumlah" placeholder="0" oninput="formatRupiah(this); hitung()">
        
        <label>Target Profit (%)</label>
        <input type="text" id="margin" placeholder="0" oninput="formatRupiah(this); hitung()">
        
        <button class="btn-reset" onclick="resetForm()">RESET SEMUA DATA</button>
    </div>

    <div class="result-box" id="hasilArea" style="display:none;">
        <div class="result-row">Total HPP (1 Batch): <span id="outHpp" class="val">Rp 0</span></div>
        <div class="result-row">Modal per Pcs: <span id="outModalPcs" class="val">Rp 0</span></div>
        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
        <div>
            <span style="font-size:0.9em; color:#aaa;">Rekomendasi Harga Jual:</span>
            <span id="outHargaJual" class="final-price">Rp 0</span>
        </div>
        <!-- Saran & Analisis Pintar -->
        <div class="advice-box" id="saranBox">
            💡 <b>Analisis Pintar:</b> Masukkan data lengkap untuk melihat saran strategi harga.
        </div>
    </div>
</div>

<script>
    function formatRupiah(input) {
        let originalVal = input.value.replace(/\./g, '');
        let numericVal = originalVal.replace(/\D/g, '');
        if (numericVal !== "") {
            input.value = parseInt(numericVal, 10).toLocaleString('id-ID');
        } else {
            input.value = '';
        }
        hitung();
    }

    function getCleanVal(id) {
        let val = document.getElementById(id).value.replace(/\./g, '');
        return parseFloat(val) || 0;
    }

    function hitung() {
        let bahan = getCleanVal('bahan');
        let kemasan = getCleanVal('kemasan');
        let opsional = getCleanVal('opsional');
        let jumlah = getCleanVal('jumlah');
        let margin = getCleanVal('margin');

        let hppBatch = bahan + kemasan + opsional;
        
        if (jumlah <= 0 || hppBatch <= 0) {
            document.getElementById('hasilArea').style.display = 'none';
            return;
        }

        let modalPcs = hppBatch / jumlah;
        let profitPerPcs = modalPcs * (margin / 100);
        let hargaJual = modalPcs + profitPerPcs;

        document.getElementById('outHpp').innerText = "Rp " + Math.round(hppBatch).toLocaleString('id-ID');
        document.getElementById('outModalPcs').innerText = "Rp " + Math.round(modalPcs).toLocaleString('id-ID');
        document.getElementById('outHargaJual').innerText = "Rp " + Math.round(hargaJual).toLocaleString('id-ID');

        // Logika Saran Pintar Berdasarkan Hasil
        let saranText = "✅ <b>Strategi Harga Aman:</b> Harga jual sudah memperhitungkan modal produksi dan margin keuntungan target Anda.";
        if (modalPcs < 1000) {
            saranText = "⚠️ <b>Catatan Kecil:</b> Modal per pcs di bawah Rp 1.000. Pastikan jumlah kuantitas produksi sudah pas, atau bulatkan harga jual ke nominal terdekat agar mudah transaksi uang pas.";
        } else if (margin > 100) {
            saranText = "🔥 <b>Target Profit Tinggi:</b> Anda menetapkan profit di atas 100%. Pastikan daya beli pelanggan di pasaran tetap masuk akal untuk rentang harga ini.";
        }
        document.getElementById('saranBox').innerHTML = saranText;

        document.getElementById('hasilArea').style.display = 'block';
    }

    function resetForm() {
        document.querySelectorAll('input').forEach(input => input.value = '');
        document.getElementById('hasilArea').style.display = 'none';
    }
</script>

</body>
</html>
